<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pivot Cross Scanner</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--line:#222c48;--tx:#e6ebf8;--mut:#8592b5;--acc:#2f9bff;--up:#22c55e;--dn:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:60px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}
button{font:inherit;color:inherit}
.ib{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.panel{margin:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.panel label,.lab{display:block;color:var(--mut);font-size:12px;margin:8px 0 5px}
.panel label:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#0e1529;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--tx);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.lv.on{background:var(--up);border-color:var(--up)}
.chip.sm{padding:4px 9px;font-size:12px}
.lvr{padding:6px 0;border-bottom:1px solid var(--line)}
.lvr:last-child{border-bottom:0}
.lvn{font-size:12.5px;margin-bottom:4px;font-weight:600}
.mag{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mag div{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
select,input[type=text]{background:#0e1529;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;width:100%}
#status{margin:6px 14px;color:var(--mut);font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#bar{height:3px;background:var(--line);margin:0 14px 6px;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.sec{margin:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;cursor:pointer}
.sh b{font-weight:600}
.cnt{border-radius:999px;padding:2px 10px;font-weight:700;background:#0e1529;color:var(--mut)}
.cnt.hit{background:rgba(34,197,94,.15);color:var(--up)}
.sec.zero{opacity:.55}
.rows{border-top:1px solid var(--line)}
.r{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r a{color:var(--tx);text-decoration:none;font-weight:600}
.r small{color:var(--mut);display:block;font-size:11px}
.pr{text-align:right;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}
.bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.b{font-size:11px;background:rgba(34,197,94,.13);color:var(--up);border-radius:6px;padding:2px 6px}
.b.d{background:rgba(239,68,68,.13);color:var(--dn)}
.b.m{background:rgba(47,155,255,.14);color:var(--acc)}
.b i{font-style:normal;opacity:.85}
.msg{margin:14px;color:var(--mut);text-align:center}
#set{display:none}#set.show{display:block}
.note{color:var(--mut);font-size:11.5px;margin-top:6px}
.tools{display:flex;gap:6px;margin:6px 12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>📈 Pivot Cross Scanner</h1>
  <div><button class="ib" id="gear">⚙ Settings</button></div>
</header>

<section class="panel" id="set">
  <label>Cloudflare Worker URL (रिकमेंडेड — तेज़ और भरोसेमंद)</label>
  <input type="text" id="worker" placeholder="https://yourname.workers.dev  (खाली = फ्री public proxy)">
  <label>Auto refresh</label>
  <select id="auto"><option value="0">बंद</option><option value="1">हर 1 मिनट</option><option value="5">हर 5 मिनट</option><option value="15">हर 15 मिनट</option></select>
  <div class="tools" style="margin:10px 0 0"><button class="ib" id="reload">🔄 स्टॉक लिस्ट / सेक्टर फिर से लोड करें</button></div>
  <div class="note" id="ustat"></div>
</section>

<section class="panel">
  <label>यूनिवर्स</label><div class="chips" id="uni"></div>
  <label>Latest Close का टाइमफ्रेम</label><div class="chips" id="ctf"></div>
  <label>कंडीशन: हर लेवल के आगे जो टाइमफ्रेम दबाओगे, उसी का लेवल चेक होगा (एक से ज़्यादा भी चुन सकती हो)</label><div id="lv"></div>
  <div class="mag" style="margin-top:10px">
    <div>दिशा<div class="chips" id="side"></div></div>
    <div>लेवल किसका<div class="chips" id="lmode"></div></div>
    <div>एक से ज़्यादा कंडीशन<div class="chips" id="comb"></div></div>
    <div>व्यू<div class="chips" id="view"></div></div>
  </div>
  <label>Moving Average फ़िल्टर (ऊपर की कंडीशन के साथ AND)</label>
  <div class="mag" id="ma"></div>
</section>

<div id="status"></div>
<div id="bar"><i></i></div>
<div class="tools" id="tools"></div>
<div id="res"></div>

<script>
const $=s=>document.querySelector(s);
const LVN={L3:'Camarilla L3',R3:'Camarilla R3',S1:'Pivot S1',R1:'Pivot R1'};
const UNI=[['nifty50','Nifty 50'],['nifty200','Nifty 200'],['nifty500','Nifty 500'],['midcap250','Midcap 250'],['smallcap250','Smallcap 250'],['fno','F&O'],['all','सभी NSE']];
const CTF=[['1m','1 मिनट'],['5m','5 मिनट'],['15m','15 मिनट'],['30m','30 मिनट'],['1h','1 घंटा'],['1D','Daily'],['1W','Weekly'],['1M','Monthly'],['1Q','Quarterly'],['6M','Half-yearly'],['1Y','Yearly']];
const LTF=[['1D','Daily'],['1W','Weekly'],['1M','Monthly'],['1Q','Quarterly'],['6M','Half-yearly'],['1Y','Yearly']];
const LTFS={'1D':'D','1W':'W','1M':'M','1Q':'Q','6M':'H','1Y':'Y'};
const MAS=[['d20','Daily SMA 20'],['d50','Daily SMA 50'],['d200','Daily SMA 200'],['w20','Weekly SMA 20'],['w200','Weekly SMA 200']];
const LISTS={
 nifty500:'https://niftyindices.com/IndexConstituent/ind_nifty500list.csv',
 nifty200:'https://niftyindices.com/IndexConstituent/ind_nifty200list.csv',
 nifty50:'https://niftyindices.com/IndexConstituent/ind_nifty50list.csv',
 midcap250:'https://niftyindices.com/IndexConstituent/ind_niftymidcap250list.csv',
 smallcap250:'https://niftyindices.com/IndexConstituent/ind_niftysmallcap250list.csv',
 fno:'https://archives.nseindia.com/content/fo/fo_mktlots.csv',
 all:'https://archives.nseindia.com/content/equities/EQUITY_L.csv'};
const ALIAS={'Fast Moving Consumer Goods':'FMCG','Information Technology':'IT','Automobile and Auto Components':'Auto','Oil Gas & Consumable Fuels':'Oil & Gas','Media Entertainment & Publication':'Media','Financial Services':'Financial Services','Telecommunication':'Telecom'};
const FALLBACK=[['RELIANCE','Reliance Industries','Oil & Gas'],['TCS','TCS','IT'],['HDFCBANK','HDFC Bank','Financial Services'],['ICICIBANK','ICICI Bank','Financial Services'],['INFY','Infosys','IT'],['BHARTIARTL','Bharti Airtel','Telecom'],['ITC','ITC','FMCG'],['SBIN','State Bank of India','Financial Services'],['LT','Larsen & Toubro','Construction'],['HINDUNILVR','Hindustan Unilever','FMCG'],['KOTAKBANK','Kotak Mahindra Bank','Financial Services'],['AXISBANK','Axis Bank','Financial Services'],['BAJFINANCE','Bajaj Finance','Financial Services'],['MARUTI','Maruti Suzuki','Auto'],['SUNPHARMA','Sun Pharma','Healthcare'],['M&M','Mahindra & Mahindra','Auto'],['HCLTECH','HCL Tech','IT'],['NTPC','NTPC','Power'],['ULTRACEMCO','UltraTech Cement','Construction Materials'],['TITAN','Titan','Consumer Durables'],['ASIANPAINT','Asian Paints','Consumer Durables'],['BAJAJFINSV','Bajaj Finserv','Financial Services'],['POWERGRID','Power Grid','Power'],['ADANIENT','Adani Enterprises','Metals & Mining'],['ADANIPORTS','Adani Ports','Services'],['ONGC','ONGC','Oil & Gas'],['COALINDIA','Coal India','Oil & Gas'],['JSWSTEEL','JSW Steel','Metals & Mining'],['TATASTEEL','Tata Steel','Metals & Mining'],['NESTLEIND','Nestle India','FMCG'],['WIPRO','Wipro','IT'],['TECHM','Tech Mahindra','IT'],['HINDALCO','Hindalco','Metals & Mining'],['GRASIM','Grasim','Construction Materials'],['CIPLA','Cipla','Healthcare'],['DRREDDY','Dr Reddys','Healthcare'],['EICHERMOT','Eicher Motors','Auto'],['BAJAJ-AUTO','Bajaj Auto','Auto'],['HEROMOTOCO','Hero MotoCorp','Auto'],['APOLLOHOSP','Apollo Hospitals','Healthcare'],['BRITANNIA','Britannia','FMCG'],['SBILIFE','SBI Life','Financial Services'],['HDFCLIFE','HDFC Life','Financial Services'],['TRENT','Trent','Consumer Services'],['INDUSINDBK','IndusInd Bank','Financial Services'],['SHRIRAMFIN','Shriram Finance','Financial Services'],['BEL','Bharat Electronics','Capital Goods'],['TATACONSUMER','Tata Consumer','FMCG'],['JIOFIN','Jio Financial','Financial Services'],['INDIGO','InterGlobe Aviation','Services']];

// ---------- state ----------
const DEF={uni:'nifty500',ctf:'1D',ltf:'1M',side:'above',lmode:'next',comb:'any',view:'sector',
 lv:{L3:[],R3:[],S1:[],R1:[]},ma:{d20:'off',d50:'off',d200:'off',w20:'off',w200:'off'},worker:'',auto:'0'};
let S=Object.assign({},DEF);
try{const x=JSON.parse(localStorage.cps_state||'{}');S=Object.assign({},DEF,x,{lv:Object.assign({},DEF.lv,x.lv),ma:Object.assign({},DEF.ma,x.ma)})}catch(e){}
{const lv={};for(const k of Object.keys(DEF.lv))lv[k]=Array.isArray(S.lv[k])?S.lv[k]:[];S.lv=lv}
const save=()=>localStorage.cps_state=JSON.stringify(S);
let STK={};            // sym -> {n,sec,f:[flags]}
const openSec=new Set();

// ---------- proxy / data ----------
function px(u){const w=(S.worker||'').trim().replace(/\/$/,'');return w?`${w}/?url=${encodeURIComponent(u)}`:'https://corsproxy.io/?url='+encodeURIComponent(u)}
const YP={'1m':['1m','5d'],'5m':['5m','5d'],'15m':['15m','1mo'],'30m':['30m','1mo'],'1h':['60m','3mo'],'d':['1d','1y'],'w':['1wk','6y'],'m':['1mo','25y']};
const isIntra=k=>['1m','5m','15m','30m','1h'].includes(k);
const cache=new Map(),inflight=new Map();
async function base(sym,key){
  const ck=sym+'|'+key,ttl=isIntra(key)?45e3:6e5,h=cache.get(ck);
  if(h&&Date.now()-h.ts<ttl)return h.v;
  if(inflight.has(ck))return inflight.get(ck);
  const p=(async()=>{const[iv,rg]=YP[key];let err;
    for(const host of['query1','query2']){try{
      const u=`https://${host}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}.NS?interval=${iv}&range=${rg}&includePrePost=false`;
      const r=await fetch(px(u));if(!r.ok)throw new Error('http '+r.status);
      const j=await r.json();const res=j.chart&&j.chart.result&&j.chart.result[0];if(!res)throw new Error('nodata');
      const q=res.indicators.quote[0],out=[];
      (res.timestamp||[]).forEach((t,i)=>{if(q.close[i]!=null)out.push({t,h:q.high[i]??q.close[i],l:q.low[i]??q.close[i],c:q.close[i]})});
      cache.set(ck,{ts:Date.now(),v:out});return out}catch(e){err=e}}
    throw err})();
  inflight.set(ck,p);try{return await p}finally{inflight.delete(ck)}
}
function resample(b,kind){const out=[];let key=null,cur=null;
  for(const x of b){const d=new Date((x.t+19800)*1000),y=d.getUTCFullYear(),m=d.getUTCMonth();
    const k=kind==='y'?''+y:kind==='h'?y+'-'+(m/6|0):y+'-'+(m/3|0);
    if(k!==key){key=k;cur={t:x.t,h:x.h,l:x.l,c:x.c};out.push(cur)}else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c}}
  return out}
async function series(sym,tf){
  const m={'1D':['d'],'1W':['w'],'1M':['m'],'1Q':['m','q'],'6M':['m','h'],'1Y':['m','y']}[tf];
  if(!m)return base(sym,tf);
  const b=await base(sym,m[0]);return m[1]?resample(b,m[1]):b}

// ---------- maths ----------
function levelsFrom(b){const{h,l,c}=b,r=h-l,P=(h+l+c)/3;
  return{L3:c-r*1.1/4,R3:c+r*1.1/4,S1:2*P-h,R1:2*P-l,P}}
function smaAt(b,i,n){if(i+1<n||i<0)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=b[k].c;return s/n}
const anyMA=()=>Object.values(S.ma).some(v=>v!=='off');
const lvPairs=()=>Object.entries(S.lv).flatMap(([k,a])=>a.map(tf=>[k,tf]));
const anyLv=()=>lvPairs().length>0;
const anyCond=()=>anyLv()||anyMA();
const ltfLabel=tf=>(LTF.find(x=>x[0]===tf)||[,''])[1];
async function evalStock(st){
  const sym=st.s,o={st,hits:[],ok:false};
  const cs=await series(sym,S.ctf);
  if(cs.length<2){o.err='data';return o}
  const n=cs.length,last=cs[n-1].c,prev=cs[n-2].c;o.price=last;o.chg=(last/prev-1)*100;
  const up=S.side==='above';
  const crossed=(p,c,v)=>up?(p<=v&&c>v):(p>=v&&c<v);
  let lvOk=true;
  const act=lvPairs();
  if(act.length){
    const tfs=[...new Set(act.map(p=>p[1]))],LV={};
    for(const tf of tfs){
      const ls=await series(sym,tf);
      const src=S.lmode==='next'?ls[ls.length-1]:ls[ls.length-2];
      if(src)LV[tf]=levelsFrom(src)}
    const res=act.map(([k,tf])=>{const L=LV[tf];if(!L)return false;const ok=crossed(prev,last,L[k]);if(ok)o.hits.push({t:'lv',k,tf,v:L[k]});return ok});
    if(!Object.keys(LV).length){o.err='lvl';return o}
    lvOk=S.comb==='any'?res.some(Boolean):res.every(Boolean);
  }
  let maOk=true;
  for(const[k,name]of MAS){const mode=S.ma[k];if(mode==='off')continue;
    const ms=await series(sym,k[0]==='d'?'1D':'1W'),pd=+k.slice(1),i=ms.length-1;
    const a=smaAt(ms,i,pd),p0=smaAt(ms,i-1,pd);
    if(a==null){maOk=false;continue}
    const ok=mode==='cross'?(p0!=null&&(up?ms[i-1].c<=p0&&ms[i].c>a:ms[i-1].c>=p0&&ms[i].c<a)):(up?ms[i].c>a:ms[i].c<a);
    if(ok)o.hits.push({t:'ma',k,name,v:a,mode});else maOk=false}
  o.ok=lvOk&&maOk&&anyCond();
  return o}

// ---------- universe ----------
function parseCSV(t){return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o})}
const NOTSTK=new Set(['NIFTY','BANKNIFTY','FINNIFTY','MIDCPNIFTY','NIFTYNXT50','SYMBOL']);
async function loadUniverse(force){
  const us=$('#ustat');
  let c;try{c=JSON.parse(localStorage.cps_uni||'null')}catch(e){}
  if(!force&&c&&Date.now()-c.ts<6048e5){STK=c.d;us.textContent=`स्टॉक लिस्ट: ${Object.keys(STK).length} स्टॉक (सेव्ड)`;return}
  const d={};const bad=[];let okc=0;
  for(const[k,u]of Object.entries(LISTS)){
    try{
      us.textContent='लोड हो रहा: '+k+' …';
      const r=await fetch(px(u));if(!r.ok)throw 0;
      const rows=parseCSV(await r.text());
      const hd=rows.findIndex(r=>r.some(x=>/^symbol$/i.test(x)));if(hd<0)throw 0;
      const H=rows[hd].map(x=>x.trim().toUpperCase());
      const iS=H.indexOf('SYMBOL'),iN=H.findIndex(x=>x==='COMPANY NAME'||x==='NAME OF COMPANY'||x==='UNDERLYING'),iI=H.indexOf('INDUSTRY'),iR=H.indexOf('SERIES');
      for(const r of rows.slice(hd+1)){
        const s=(r[iS]||'').trim();if(!s||NOTSTK.has(s)||/\s/.test(s))continue;
        if(k==='all'&&iR>=0&&(r[iR]||'').trim()!=='EQ')continue;
        const o=d[s]||(d[s]={n:'',sec:'',f:[]});
        if(!o.n&&iN>=0)o.n=r[iN]||s;
        if(iI>=0&&r[iI]&&!o.sec)o.sec=ALIAS[r[iI]]||r[iI];
        if(!o.f.includes(k))o.f.push(k)}
      okc++}catch(e){bad.push(k)}}
  if(!okc){FALLBACK.forEach(([s,n,sec])=>d[s]={n,sec,f:['nifty50','nifty200','nifty500','fno','all']});
    us.textContent='⚠ NSE लिस्ट नहीं मिली, सिर्फ़ Nifty 50 (बिल्ट-इन) चल रहा है। Worker URL डालकर 🔄 दबाओ।'}
  else us.textContent=`स्टॉक लिस्ट: ${Object.keys(d).length} स्टॉक${bad.length?' · न मिली: '+bad.join(', '):''}`;
  Object.values(d).forEach(o=>{if(!o.sec)o.sec='Unclassified'});
  STK=d;if(okc)localStorage.cps_uni=JSON.stringify({ts:Date.now(),d})}
function universe(){return Object.entries(STK).filter(([s,o])=>o.f.includes(S.uni)).map(([s,o])=>({s,n:o.n||s,sec:o.sec}))}

// ---------- UI ----------
const chip=(g,v,l,on,cls='')=>`<button class="chip ${cls} ${on?'on':''}" data-g="${g}" data-v="${v}">${l}</button>`;
function drawControls(){
  $('#uni').innerHTML=UNI.map(([v,l])=>chip('uni',v,l,S.uni===v)).join('');
  $('#ctf').innerHTML=CTF.map(([v,l])=>chip('ctf',v,l,S.ctf===v)).join('');
  $('#lv').innerHTML=Object.entries(LVN).map(([k,l])=>`<div class="lvr"><div class="lvn">${l}</div><div class="chips">${LTF.map(([v,n])=>`<button class="chip lv sm ${S.lv[k].includes(v)?'on':''}" data-g="lv" data-l="${k}" data-v="${v}">${n}</button>`).join('')}</div></div>`).join('');
  $('#side').innerHTML=chip('side','above','Crossed Above',S.side==='above','sm')+chip('side','below','Crossed Below',S.side==='below','sm');
  $('#lmode').innerHTML=chip('lmode','next','Next period',S.lmode==='next','sm')+chip('lmode','cur','Current period',S.lmode==='cur','sm');
  $('#comb').innerHTML=chip('comb','any','कोई भी (OR)',S.comb==='any','sm')+chip('comb','all','सभी (AND)',S.comb==='all','sm');
  $('#view').innerHTML=chip('view','sector','Sector-wise',S.view==='sector','sm')+chip('view','list','List',S.view==='list','sm');
  $('#ma').innerHTML=MAS.map(([k,l])=>`<div>${l}<select data-ma="${k}"><option value="off">बंद</option><option value="cross"${S.ma[k]==='cross'?' selected':''}>Close Crossed</option><option value="hold"${S.ma[k]==='hold'?' selected':''}>Close Above/Below</option></select></div>`).join('');
  $('#worker').value=S.worker||'';$('#auto').value=S.auto||'0'}
let qt;const queueScan=()=>{clearTimeout(qt);qt=setTimeout(scan,250)};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-g]');
  if(b){const g=b.dataset.g,v=b.dataset.v;if(g==='lv'){const a=S.lv[b.dataset.l],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}else S[g]=v;save();drawControls();g==='view'?render():queueScan();return}
  const h=e.target.closest('[data-sec]');
  if(h){const k=h.dataset.sec;openSec.has(k)?openSec.delete(k):openSec.add(k);render();return}
  const t=e.target.closest('[data-tool]');
  if(t&&t.dataset.tool==='copy'){const l=[...results.values()].filter(r=>r.ok).map(r=>'NSE:'+r.st.s.replace(/[&-]/g,'_')).join(',');navigator.clipboard&&navigator.clipboard.writeText(l);t.textContent='✅ कॉपी हो गया'}
  if(t&&t.dataset.tool==='all'){const secs=new Set([...document.querySelectorAll('[data-sec]')].map(x=>x.dataset.sec));const allOpen=[...secs].every(x=>openSec.has(x));secs.forEach(x=>allOpen?openSec.delete(x):openSec.add(x));render()}
});
document.addEventListener('change',e=>{const m=e.target.dataset.ma;if(m){S.ma[m]=e.target.value;save();queueScan()}});
$('#gear').onclick=()=>$('#set').classList.toggle('show');
$('#worker').onchange=e=>{S.worker=e.target.value;save()};
$('#auto').onchange=e=>{S.auto=e.target.value;save();setAuto()};
$('#reload').onclick=async()=>{await loadUniverse(true);queueScan()};
let at;function setAuto(){clearInterval(at);const m=+S.auto;if(m)at=setInterval(()=>{if(!document.hidden)scan()},m*6e4)}

// ---------- scan & render ----------
let scanId=0,results=new Map(),prog={done:0,total:0,err:0},rt;
const sched=()=>{if(!rt)rt=setTimeout(()=>{rt=null;render()},300)};
async function scan(){
  const id=++scanId,list=universe();
  results=new Map();prog={done:0,total:list.length,err:0};
  if(!anyCond()||!list.length){render();return}
  let i=0;const N=(S.worker||'').trim()?16:6;
  const run=async()=>{while(id===scanId){const k=i++;if(k>=list.length)break;const st=list[k];
    try{const r=await evalStock(st);if(id!==scanId)return;results.set(st.s,r);if(r.err)prog.err++}
    catch(e){if(id!==scanId)return;prog.err++;results.set(st.s,{st,err:String(e),hits:[]})}
    prog.done++;sched()}};
  await Promise.all(Array.from({length:N},run));
  if(id===scanId){prog.t=new Date();render()}}
const fmt=n=>n==null?'-':n.toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function badges(r){const up=S.side==='above',ar=up?'▲':'▼';
  return r.hits.map(h=>h.t==='lv'
    ?`<span class="b ${up?'':'d'}">${ar} ${LTFS[h.tf]} ${S.lmode==='next'?'Next':'Cur'} ${LVN[h.k]} <i>${fmt(h.v)}</i></span>`
    :`<span class="b m">${ar} ${h.name} <i>${fmt(h.v)}</i></span>`).join('')}
function row(r){
  const c=r.chg>=0?'up':'dn';
  return `<div class="r"><div><a href="https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(r.st.s)}" target="_blank" rel="noopener">${esc(r.st.s)}</a><small>${esc(r.st.n)}</small><div class="bs">${badges(r)}</div></div><div class="pr"><b>${fmt(r.price)}</b><small class="${c}">${r.chg>=0?'+':''}${r.chg.toFixed(2)}%</small></div></div>`}
function render(){
  const list=universe(),hit=[...results.values()].filter(r=>r.ok);
  $('#bar i').style.width=(prog.total?prog.done/prog.total*100:0)+'%';
  const ct=(CTF.find(x=>x[0]===S.ctf)||[,''])[1];
  $('#status').innerHTML=anyCond()?`<span>स्कैन ${prog.done}/${prog.total} · एरर ${prog.err}${prog.t?' · '+prog.t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):''}</span><span><b class="up">${hit.length} मिले</b> · Close: ${ct}</span>`:'<span>ऊपर कोई कंडीशन या MA फ़िल्टर चुनो</span>';
  $('#tools').innerHTML=hit.length?`<button class="ib" data-tool="copy">📋 TradingView लिस्ट कॉपी</button>`+(S.view==='sector'?`<button class="ib" data-tool="all">⇅ सब खोलो/बंद करो</button>`:''):'';
  if(!anyCond()){$('#res').innerHTML='<div class="msg">कंडीशन चुनते ही रिज़ल्ट आ जाएगा।</div>';return}
  if(S.view==='list'){
    hit.sort((a,b)=>b.chg-a.chg);
    $('#res').innerHTML=hit.length?`<div class="sec">${hit.map(row).join('')}</div>`:`<div class="msg">${prog.done<prog.total?'स्कैन चल रहा है…':'कोई स्टॉक नहीं मिला'}</div>`;return}
  const tot={},got={};
  list.forEach(s=>tot[s.sec]=(tot[s.sec]||0)+1);
  hit.forEach(r=>(got[r.st.sec]=got[r.st.sec]||[]).push(r));
  const secs=Object.keys(tot).sort((a,b)=>(got[b]?.length||0)-(got[a]?.length||0)||a.localeCompare(b));
  $('#res').innerHTML=secs.map(s=>{const g=got[s]||[],o=openSec.has(s);g.sort((a,b)=>b.chg-a.chg);
    return `<div class="sec ${g.length?'':'zero'}"><div class="sh" data-sec="${esc(s)}"><b>${o?'▾':'▸'} ${esc(s)}</b><span class="cnt ${g.length?'hit':''}">${g.length} / ${tot[s]}</span></div>${o?`<div class="rows">${g.length?g.map(row).join(''):'<div class="msg" style="margin:10px">इस सेक्टर में कोई स्टॉक नहीं</div>'}</div>`:''}</div>`}).join('')}

// ---------- boot ----------
(async()=>{
  drawControls();$('#res').innerHTML='<div class="msg">स्टॉक लिस्ट लोड हो रही है…</div>';
  await loadUniverse(false);setAuto();scan();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
})();
</script>
</body>
</html>
